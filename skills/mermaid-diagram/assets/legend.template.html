<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그림 기호 읽는 법</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<!--
  legend_page.py 가 만든 파일이다. 손으로 고치지 말고 다시 만든다.
  이 틀은 assets/legend.template.html 이다. 스크립트는 DATA 자리와 SVG 자리만 갈아 끼운다.
-->
<style>
/*SHARED_CSS*/
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="lg-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A0"/></marker>
    <marker id="lg-xx" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1,1 L9,9 M9,1 L1,9" stroke="#8A94A0" stroke-width="1.8" fill="none"/></marker>
  </defs>
</svg>

<div class="page">
  <header>
    <h1>그림 기호 읽는 법</h1>
    <p class="lede" id="lede"></p>
    <div class="axes">
      <div class="axis"><b>모양</b><span>그것이 무엇인가. 단계인지, DB 인지, 파일인지.</span></div>
      <div class="axis"><b>색</b><span>무슨 역할인가. 외부인지, LLM 이 닿는지, 거르는지.</span></div>
      <div class="axis"><b>선</b><span>무엇이 오가나. 굵은 선만 따라가면 전체가 읽힌다.</span></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button class="tab" role="tab" id="tab-all" aria-controls="all" data-view="all">전체 기호</button>
    <button class="tab" role="tab" id="tab-example" aria-controls="example" data-view="example"></button>
  </nav>

  <section class="part" id="all" role="tabpanel"></section>

  <section class="part" id="example" role="tabpanel" hidden>
    <div class="ex">
      <figure class="fig" id="fig">
<!--SVG-->
        <figcaption id="figcap"></figcaption>
      </figure>
      <div class="groups">
        <div id="ex-read">
          <div class="sec-head"><h2>이 그림을 읽는 순서</h2><p id="ex-question"></p></div>
          <ol class="read" id="ex-steps"></ol>
        </div>
        <div id="ex-g-shape"><div class="sec-head"><h2 id="ex-h-shape"></h2><p class="hint">항목을 누르면 고정되고, 한 번 더 누르면 풀린다.</p></div><div class="rows" id="ex-shape"></div></div>
        <div id="ex-g-class"><div class="sec-head"><h2 id="ex-h-class"></h2></div><div class="rows" id="ex-class"></div></div>
        <div id="ex-g-line"><div class="sec-head"><h2 id="ex-h-line"></h2></div><div class="rows" id="ex-line"></div></div>
        <div id="ex-g-box"><div class="sec-head"><h2 id="ex-h-box"></h2></div><div class="rows" id="ex-box"></div></div>
        <div id="ex-g-unused"><div class="sec-head"><h2>이 그림에는 없는 것</h2><p>아래 기호는 이 그림에 나오지 않는다. 뜻은 "전체 기호" 탭에 있다.</p></div><div class="chips" id="ex-unused"></div></div>
      </div>
    </div>
  </section>
</div>

<script>
const DATA = /*DATA*/;

/*SHARED_JS*/
document.getElementById('lede').textContent = DATA.lede;
renderVocab(document.getElementById('all'), DATA.vocab, DATA.terms);

// 예시 탭
const EX = DATA.example;
if (EX) {
  document.getElementById('tabs').hidden = false;
  document.getElementById('tab-example').textContent = `${EX.name}에 쓰인 것`;
  document.getElementById('figcap').textContent = `${EX.file} · 항목을 누르면 해당 부분만 진하게 보인다`;
  const fig = document.querySelector('#fig svg');
  tameSvg(fig);
  if (EX.question) document.getElementById('ex-question').textContent = `이 그림이 답하는 질문: ${EX.question}`;
  if (EX.reading && EX.reading.length) {
    document.getElementById('ex-steps').innerHTML = EX.reading.map(r => `<li>${tipify(r)}</li>`).join('');
  } else if (!EX.question) {
    document.getElementById('ex-read').hidden = true;
  } else {
    document.getElementById('ex-steps').hidden = true;
  }
  const nodeEl = nodeMapOf(fig);
  const els = (r) => elsFor(fig, nodeEl, r);
  const rowsByKey = {};
  for (const [k, word] of LG_KINDS) {
    const rows = EX.rows[k] || [];
    document.getElementById(`ex-g-${k}`).hidden = !rows.length;
    if (!rows.length) continue;
    document.getElementById(`ex-h-${k}`).textContent = `쓰인 ${word} ${rows.length}가지`;
    document.getElementById(`ex-${k}`).innerHTML = rows.map((r, i) => { rowsByKey[`${k}-${i}`] = r; return rowHTML(k, r, `${k}-${i}`); }).join('');
  }
  document.getElementById('ex-unused').innerHTML = EX.unused.map(u => `<span class="chip">${esc(u)}</span>`).join('');
  document.getElementById('ex-g-unused').hidden = !EX.unused.length;
  let pinned = null;
  const show = (k) => {
    if (!fig) return;
    fig.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
    if (!k) { fig.classList.remove('focusing'); return; }
    fig.classList.add('focusing');
    els(rowsByKey[k]).forEach(e => e.classList.add('hl'));
  };
  document.querySelectorAll('.row').forEach(b => {
    b.addEventListener('mouseenter', () => { if (!pinned) show(b.dataset.k); });
    b.addEventListener('mouseleave', () => { if (!pinned) show(null); });
    b.addEventListener('focus', () => { if (!pinned) show(b.dataset.k); });
    b.addEventListener('blur', () => { if (!pinned) show(null); });
    b.addEventListener('click', () => {
      document.querySelectorAll('.row.on').forEach(r => { r.classList.remove('on'); r.setAttribute('aria-pressed', 'false'); });
      if (pinned === b.dataset.k) { pinned = null; show(null); return; }
      pinned = b.dataset.k; b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); show(pinned);
    });
  });
  const route = () => {
    const v = location.hash === '#example' ? 'example' : 'all';
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === v)));
    document.getElementById('all').hidden = v !== 'all';
    document.getElementById('example').hidden = v !== 'example';
  };
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { location.hash = t.dataset.view; route(); }));
  window.addEventListener('hashchange', route);
  route();
}
</script>
</body>
</html>
