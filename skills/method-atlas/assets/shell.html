<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
__CSS__
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
      <div class="q" id="q"></div>
    </div>
    <div class="side">
      <div class="legend" id="legend" aria-label="색 범례"></div>
      <div class="views" id="views" aria-label="보기 설정"></div>
    </div>
  </header>

  <section class="answer" id="answer" aria-label="권장 출발점" hidden></section>

  <section class="mapw" id="map" aria-label="흐름 지도" hidden></section>

  <section class="board" aria-label="조건 필터">
    <div class="board-head">
      <h2><button type="button" class="boardt" id="boardt" aria-expanded="true">조건으로 찾기</button> <span class="hint">· 해당 <span class="count" id="count"></span> / <span id="total"></span> · <span class="tt" tabindex="0" data-tip="같은 축 안에서는 OR, 축 사이에서는 AND 로 적용한다">규칙</span></span></h2>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="hint" id="active"></span>
        <button class="reset" id="reset" type="button">조건 초기화</button>
      </div>
    </div>
    <div class="groups" id="groups"></div>
    <p class="crit" id="crit"></p>
  </section>

  <section class="work">
    <nav class="list" id="list" aria-label="목록"></nav>
    <div class="pane">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="body" id="body"></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>
<script>
__DATA__
</script>
<script>
__ENGINE__
</script>
</body>
</html>
